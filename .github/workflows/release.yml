# Manual-only release, gated on `"private": false` in package.json and an NPM_TOKEN secret (ADR 0011).
# Pending changesets open a "Version Packages" PR; once it is merged, the next run publishes.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check release gate
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          private=$(node -p "require('./package.json').private === true")
          if [ "$private" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json is \"private\": true — skipping release. This is not a failure."
          elif [ -z "$NPM_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret is not set — skipping release. This is not a failure."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Version PR or publish
        if: steps.gate.outputs.ready == 'true'
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
